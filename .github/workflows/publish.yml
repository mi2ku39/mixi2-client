name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Select the semver bump type for bumpp
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-pnpm

      - name: Run checks
        run: |
          pnpm run build
          pnpm run test
          pnpm run typecheck

      - name: Bump version with bumpp
        run: pnpm exec bumpp "${{ github.event.inputs.version_bump }}" --commit "chore(release): %s" --tag "v%s"

      - name: Push version commit and tag
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Publish package (OIDC Trusted Publisher)
        run: pnpm publish --access public --no-git-checks --provenance
